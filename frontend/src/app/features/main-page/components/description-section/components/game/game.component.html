<div class="game-container">
    <p [class.adult-game]="isAdultGame()" class="game-data">
        {{ game().oneHundredPercentIconName }} {{ game().name }}

        @for (category of game().categories; track category.type) {
            {{ category.iconName }}
        }
    </p>

    @if (shouldShowEdition()) {
        <div class="icon-container">
            <button (click)="editGame()" [attr.aria-label]="`Edit ${game().name}`" class="icon-button" matIconButton type="button">
                <mat-icon fontIcon="edit"></mat-icon>
            </button>
            <button (click)="deleteGame()" [attr.aria-label]="`Delete ${game().name}`" class="icon-button" matIconButton type="button">
                <mat-icon fontIcon="delete"></mat-icon>
            </button>
        </div>
    }
</div>
