<div class="game-container">
    <p [class.adult-game]="isAdultGame()" class="game-data">
        {{ oneHundredPercentIconName() }} {{ name() }}

        @for (category of categories(); track category.type) {
            {{ category.iconName }}
        }
    </p>

    @if (shouldShowEdition()) {
        <div class="icon-container">
            <mat-icon (click)="editGame()" fontIcon="edit" class="icon"></mat-icon>
            <mat-icon (click)="deleteGame()" fontIcon="delete" class="icon"></mat-icon>
        </div>
    }
</div>
