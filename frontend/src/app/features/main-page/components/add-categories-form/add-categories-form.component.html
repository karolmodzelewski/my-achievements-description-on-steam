<mados-expandable-section
    [headingText]="'addCategoriesForm.heading' | transloco"
    [headingId]="headingId"
    [contentId]="categoriesFormsId"
>
    <ng-template>
        <div class="categories">
            @if (oneHundredPercentCategory(); as oneHundredPercentCategory) {
                <mados-one-hundred-percent-form (categorySaved)="categoriesSaved.emit()" [category]="oneHundredPercentCategory" data-testId="oneHundredPercentForm" />
            }

            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.MAIN" [categories]="mainCategories()" data-testId="categoryKindForm" />
            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.LENGTH" [categories]="lengthCategories()" data-testId="categoryKindForm" />
            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.DIFFICULTY" [categories]="difficultyCategories()" data-testId="categoryKindForm" />
        </div>
    </ng-template>
</mados-expandable-section>
