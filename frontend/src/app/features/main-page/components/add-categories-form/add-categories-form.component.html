@let collapseText = 'addCategoriesForm.collapse' | transloco;

<section [attr.aria-labelledby]="headingId">
    <mados-section-heading [headingText]="'addCategoriesForm.heading' | transloco" [id]="headingId" class="section-heading" />

    @if (shouldShowCategories()) {
        <button
            #topCollapseButton
            (click)="handleCategoriesVisibility()"
            [attr.aria-controls]="categoriesFormsId"
            aria-expanded="true"
            class="expansion-button top-expansion-button button"
            color="primary"
            type="button"
            matButton="elevated"
        >
            <mados-expansion-button-text [buttonText]="collapseText" iconName="expand_less" />
        </button>

        <div [id]="categoriesFormsId" class="categories">
            @if (oneHundredPercentCategory(); as oneHundredPercentCategory) {
                <mados-one-hundred-percent-form (categorySaved)="categoriesSaved.emit()" [category]="oneHundredPercentCategory" />
            }

            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.MAIN" [categories]="mainCategories()" />
            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.LENGTH" [categories]="lengthCategories()" />
            <mados-category-kind-form (categoriesSaved)="categoriesSaved.emit()" [kind]="CategoryKind.DIFFICULTY" [categories]="difficultyCategories()" />
        </div>
    }

    <button
        #bottomExpansionButton
        (click)="handleCategoriesVisibility()"
        [attr.aria-controls]="shouldShowCategories() ? categoriesFormsId : null"
        [attr.aria-expanded]="shouldShowCategories()"
        class="expansion-button button"
        color="primary"
        type="button"
        matButton="elevated"
    >
        @if (shouldShowCategories()) {
            <mados-expansion-button-text [buttonText]="collapseText" iconName="expand_less" />
        } @else {
            <mados-expansion-button-text [buttonText]="'addCategoriesForm.expand' | transloco" iconName="expand_more" />
        }
    </button>
</section>
