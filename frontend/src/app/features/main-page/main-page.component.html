<mados-header />

@if (hasError()) {
    <mados-error-state class="margin-top" />
} @else if (data(); as pageData) {
    <mados-add-categories-form (reloadDescription)="reloadDescription()" [categories]="pageData.categories" />

    @if (pageData.description.categories.length) {
        <mados-add-game-form (reloadDescription)="reloadDescription()" />
        <mados-description-section (reloadDescription)="reloadDescription()" [descriptionData]="pageData.description" />
    } @else {
        <mados-infobar [message]="infobarMessage" class="margin-top" />
    }
} @else {
    <mados-loading-state class="margin-top" />
}
