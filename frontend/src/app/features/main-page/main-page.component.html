<mados-header />

@if (hasError()) {
    <mados-error-state class="margin-top" />
} @else if (data(); as pageData) {
    <mados-add-categories-form
        (categoriesSaved)="reloadCategoriesAndDescription()"
        [oneHundredPercentCategory]="oneHundredPercentCategory()"
        [mainCategories]="mainCategories()"
        [lengthCategories]="lengthCategories()"
        [difficultyCategories]="difficultyCategories()"
    />

    @if (isOneHundredPercentIconSet()) {
        <mados-add-game-form
            (reloadDescription)="reloadDescription()"
            [mainCategories]="mainCategories()"
            [lengthCategories]="lengthCategories()"
            [difficultyCategories]="difficultyCategories()"
        />
        <mados-description-section (reloadDescription)="reloadDescription()" [descriptionData]="pageData.description" />
    } @else {
        <mados-infobar [message]="'mainPage.infobar' | transloco" class="margin-top" />
    }
} @else {
    <mados-loading-state class="margin-top" />
}
