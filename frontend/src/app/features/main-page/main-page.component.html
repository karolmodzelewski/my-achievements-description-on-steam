<mados-header />

@if (viewState() === ViewState.SUCCESS) {
    <mados-add-categories-form (reloadDescription)="getDescriptionData()" [categories]="categories()" />
    @if (description(); as currentDescription) {
        @if (currentDescription.categories.length) {
            <mados-add-game-form (reloadDescription)="getDescriptionData()" [description]="currentDescription" />
            <mados-description-section (reloadDescription)="getDescriptionData()" [descriptionData]="currentDescription" />
        } @else {
            <mados-infobar [message]="infobarMessage" class="margin-top" />
        }
    }
}

@if (viewState() === ViewState.LOADING) {
    <mados-loading-state class="margin-top" />
}

@if (viewState() === ViewState.ERROR) {
    <mados-error-state class="margin-top" />
}
