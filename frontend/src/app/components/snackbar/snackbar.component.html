<div class="snackbar">
    <p class="message" data-testId="snackbarMessage">{{ snackbarMessage }}</p>
    <button (click)="closeSnackbar()" [attr.aria-label]="'snackbar.close' | transloco" class="close-button" data-testId="snackbarCloseButton" type="button" matIconButton>
        <mat-icon fontIcon="clear"></mat-icon>
    </button>
</div>
